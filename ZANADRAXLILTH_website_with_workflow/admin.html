<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZANADRAXLILTH | Admin</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="site-header scrolled"><a class="brand-mini" href="index.html#home"><img src="assets/zx-mark.jpg" alt="ZX"></a><div style="text-align:center;font-size:11px;letter-spacing:.2em">ZANADRAXLILTH ADMIN</div><a href="index.html" style="font-size:10px;letter-spacing:.15em">STORE ↗</a></header>
<main class="section" style="padding-top:130px">
<div class="section-head"><div><p class="eyebrow">OWNER CONTROL</p><h2>ADMIN<br>DASHBOARD</h2></div><p class="section-note">This local admin panel stores demo data in your browser. Connect a database and authentication before using it as a live store.</p></div>
<div class="admin-grid">
<section class="admin-panel"><p class="eyebrow">PRODUCT DATABASE</p><div id="admin-products"></div><button class="btn btn-light" id="add-product">ADD PRODUCT</button></section>
<section class="admin-panel"><p class="eyebrow">NEXT DROP</p><h3>COUNTDOWN</h3><label>DROP DATE & TIME<input id="drop-date" type="datetime-local"></label><button class="btn btn-light" id="save-drop">SAVE COUNTDOWN</button><p id="drop-status" class="form-status"></p><hr><p class="eyebrow">NEWSLETTER SUBSCRIBERS</p><div id="subscribers" class="small"></div></section>
</div>
</main>
<script>
const KEY="zx_products_v1",DROP="zx_drop_v1",NEWS="zx_news_v1";
const defaults=[
{id:"ZX-001",name:"ZX Core Tee",description:"A clean heavyweight streetwear tee with the official ZX identity.",category:"T-Shirts",price:699,sizes:["S","M","L","XL"],stock:24,collection:"ZX Essentials",featured:true,newDrop:true,soldOut:false},
{id:"ZX-002",name:"After Dark Hoodie",description:"Heavyweight hoodie with a minimal front identity.",category:"Hoodies",price:1199,sizes:["S","M","L","XL"],stock:15,collection:"After Dark",featured:true,newDrop:true,soldOut:false}
];
let products=JSON.parse(localStorage.getItem(KEY)||"null")||defaults;
const save=()=>localStorage.setItem(KEY,JSON.stringify(products));
function render(){
document.querySelector("#admin-products").innerHTML=products.map((p,i)=>`<div class="admin-row">
<div><b>${p.name}</b><span>${p.id} · ${p.category}</span></div>
<input data-i="${i}" data-k="price" type="number" value="${p.price}">
<input data-i="${i}" data-k="stock" type="number" value="${p.stock}">
<select data-i="${i}" data-k="category">${["T-Shirts","Hoodies","Jackets","Pants","Accessories"].map(x=>`<option ${p.category===x?"selected":""}>${x}</option>`).join("")}</select>
<label class="check"><input data-i="${i}" data-k="newDrop" type="checkbox" ${p.newDrop?"checked":""}> NEW</label>
<label class="check"><input data-i="${i}" data-k="soldOut" type="checkbox" ${p.soldOut?"checked":""}> SOLD OUT</label>
<button class="mini-btn" data-delete="${i}">DELETE</button></div>`).join("");
document.querySelectorAll("[data-i]").forEach(el=>el.onchange=()=>{const i=+el.dataset.i,k=el.dataset.k;products[i][k]=el.type==="checkbox"?el.checked:el.type==="number"?+el.value:el.value;save()});
document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{products.splice(+b.dataset.delete,1);save();render()});
}
document.querySelector("#add-product").onclick=()=>{const id="ZX-"+String(Date.now()).slice(-4);products.unshift({id,name:"New ZANADRAXLILTH Product",description:"Add your product description.",category:"T-Shirts",price:799,sizes:["S","M","L","XL"],stock:10,collection:"ZX Essentials",featured:false,newDrop:false,soldOut:false});save();render()};
const target=localStorage.getItem(DROP);if(target){const d=new Date(target);document.querySelector("#drop-date").value=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
document.querySelector("#save-drop").onclick=()=>{const v=document.querySelector("#drop-date").value;if(!v)return;localStorage.setItem(DROP,new Date(v).toISOString());document.querySelector("#drop-status").textContent="Countdown updated."};
const subs=JSON.parse(localStorage.getItem(NEWS)||"[]");document.querySelector("#subscribers").innerHTML=subs.length?subs.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #222">${x}</div>`).join(""):"No subscribers yet.";
render();
</script>
<style>
.admin-grid{display:grid;grid-template-columns:1.4fr .6fr;gap:18px}.admin-panel{border:1px solid #333;padding:25px}.admin-panel h3{font-size:28px}.admin-panel label{display:block;color:#888;font-size:9px;letter-spacing:.15em;margin:18px 0}.admin-panel input,.admin-panel select{display:block;width:100%;background:#000;color:#fff;border:0;border-bottom:1px solid #333;padding:12px 0;outline:0}.admin-row{display:grid;grid-template-columns:1.7fr .7fr .7fr 1fr .55fr .7fr auto;gap:7px;align-items:center;border-top:1px solid #222;padding:15px 0}.admin-row>div span{display:block;color:#666;font-size:8px;margin-top:5px}.admin-row input,.admin-row select{background:#000;color:#fff;border:1px solid #333;padding:8px;font-size:9px}.check{font-size:8px!important;margin:0!important;white-space:nowrap}.check input{display:inline!important;width:auto!important}.admin-panel hr{border:0;border-top:1px solid #333;margin:40px 0}@media(max-width:900px){.admin-grid{grid-template-columns:1fr}.admin-row{grid-template-columns:1fr 1fr;}.admin-row>div{grid-column:1/-1}}
</style>
</body></html>
